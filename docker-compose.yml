services:
  niamama-neo4j:
    image: neo4j:5-community
    container_name: niamama-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/niamama_graph_2026
      - NEO4J_dbms_security_procedures_unrestricted=*
    volumes:
      - niamama_neo4j_data:/data

volumes:
  niamama_neo4j_data:
