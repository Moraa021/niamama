name: niamama
description: Offline-first maternal and child care navigation engine connecting mothers to continuum-of-care protocols, WHO vaccine schedules, and emergency facility routing.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  http: ^1.2.2
  shared_preferences: ^2.3.2
  geolocator: ^13.0.1
  url_launcher: ^6.3.1
  add_2_calendar: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - docs/architecture/ui-preview/
